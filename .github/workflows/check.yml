name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install distribution Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1
          dpkg-query -W lua5.1
      - name: Verify runtime and reproducible package
        run: python scripts/check.py
